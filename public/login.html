<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — A Charkha Story</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
</head>
<body>
  <header class="header"><div class="header-inner">
    <a href="/" class="logo"><div class="logo-icon"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="#C2703E" stroke-width="2"/><circle cx="20" cy="20" r="8" stroke="#C2703E" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#C2703E"/><line x1="20" y1="4" x2="20" y2="12" stroke="#C2703E" stroke-width="1.5"/><line x1="20" y1="28" x2="20" y2="36" stroke="#C2703E" stroke-width="1.5"/><line x1="4" y1="20" x2="12" y2="20" stroke="#C2703E" stroke-width="1.5"/><line x1="28" y1="20" x2="36" y2="20" stroke="#C2703E" stroke-width="1.5"/></svg></div>
    <div class="logo-text">A Charkha <span>Story</span></div></a>
    <nav class="nav">
      <ul class="nav-links"><li><a href="/">Home</a></li><li><a href="/products">Shop</a></li><li><a href="/cart">Cart</a></li><li><a href="/orders">Orders</a></li></ul>
      <div class="nav-actions">
        <a href="/cart" class="nav-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span class="cart-badge" id="cart-badge">0</span></a>
        <div class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></div>
      </div>
    </nav>
  </div></header>

  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <h2>Welcome to<br>A Charkha Story</h2>
        <p>Join our community of conscious fashion lovers. Every purchase supports India's artisan weavers and preserves centuries-old textile traditions.</p>
        <div style="margin-top:var(--space-2xl);padding-top:var(--space-xl);border-top:1px solid rgba(255,255,255,0.1);position:relative">
          <p style="font-size:var(--font-size-sm);opacity:0.7">Demo credentials:<br>Email: demo@charkha.in<br>Password: demo1234</p>
        </div>
      </div>
      <div class="auth-form-container">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
          <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" required placeholder="your@email.com" value="demo@charkha.in">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" required placeholder="Enter password" value="demo1234">
          </div>
          <div id="login-error" class="form-error" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Sign In</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-control" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone (optional)</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div id="register-error" class="form-error" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn">Create Account</button>
        </form>
      </div>
    </div>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
