<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop premium handcrafted clothing — sarees, kurtis, shirts, dupattas in khadi, silk, cotton & more.">
  <title>Shop — A Charkha Story</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
</head>
<body>
  <!-- Header -->
  <header class="header"><div class="header-inner">
    <a href="/" class="logo"><div class="logo-icon"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="#C2703E" stroke-width="2"/><circle cx="20" cy="20" r="8" stroke="#C2703E" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#C2703E"/><line x1="20" y1="4" x2="20" y2="12" stroke="#C2703E" stroke-width="1.5"/><line x1="20" y1="28" x2="20" y2="36" stroke="#C2703E" stroke-width="1.5"/><line x1="4" y1="20" x2="12" y2="20" stroke="#C2703E" stroke-width="1.5"/><line x1="28" y1="20" x2="36" y2="20" stroke="#C2703E" stroke-width="1.5"/></svg></div>
    <div class="logo-text">A Charkha <span>Story</span></div></a>
    <nav class="nav">
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Home</a></li><li><a href="/products" class="active">Shop</a></li>
        <li><a href="/products?category=Sarees">Sarees</a></li><li><a href="/products?category=Kurtis">Kurtis</a></li>
        <li><a href="/orders">Orders</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/cart" class="nav-icon-btn" title="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span class="cart-badge" id="cart-badge">0</span></a>
        <a href="/login" class="nav-icon-btn" id="auth-link" title="Login"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        <div class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></div>
      </div>
    </nav>
  </div></header>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="/">Home</a><span class="breadcrumb-sep">›</span><span id="breadcrumb-current">Shop</span></div>
      <h1 id="page-title">Our Collection</h1>
    </div>
  </div>

  <!-- Shop Content -->
  <section class="section-sm">
    <div class="container">
      <div class="shop-layout">
        <!-- Filters Sidebar -->
        <aside class="filter-sidebar" id="filter-sidebar">
          <div class="search-bar">
            <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
            <input type="text" id="search-input" placeholder="Search products...">
          </div>

          <div class="filter-group">
            <h4>Category</h4>
            <label class="filter-option"><input type="radio" name="category" value="" checked> <span>All Categories</span></label>
            <label class="filter-option"><input type="radio" name="category" value="Sarees"> <span>Sarees</span></label>
            <label class="filter-option"><input type="radio" name="category" value="Kurtis"> <span>Kurtis</span></label>
            <label class="filter-option"><input type="radio" name="category" value="Shirts"> <span>Shirts</span></label>
            <label class="filter-option"><input type="radio" name="category" value="Dupattas"> <span>Dupattas</span></label>
            <label class="filter-option"><input type="radio" name="category" value="Fabrics"> <span>Fabrics</span></label>
          </div>

          <div class="filter-group">
            <h4>Fabric</h4>
            <label class="filter-option"><input type="radio" name="fabric" value="" checked> <span>All Fabrics</span></label>
            <label class="filter-option"><input type="radio" name="fabric" value="Khadi"> <span>Khadi</span></label>
            <label class="filter-option"><input type="radio" name="fabric" value="Silk"> <span>Silk</span></label>
            <label class="filter-option"><input type="radio" name="fabric" value="Cotton"> <span>Cotton</span></label>
            <label class="filter-option"><input type="radio" name="fabric" value="Chanderi"> <span>Chanderi</span></label>
            <label class="filter-option"><input type="radio" name="fabric" value="Linen"> <span>Linen</span></label>
          </div>

          <div class="filter-group">
            <h4>Price Range</h4>
            <div class="price-range">
              <input type="number" id="min-price" placeholder="₹ Min">
              <span>—</span>
              <input type="number" id="max-price" placeholder="₹ Max">
            </div>
          </div>

          <button class="btn btn-primary btn-full btn-sm" onclick="applyFilters()">Apply Filters</button>
          <button class="btn btn-secondary btn-full btn-sm" style="margin-top:8px" onclick="clearFilters()">Clear All</button>
        </aside>

        <!-- Products Area -->
        <div>
          <div class="shop-toolbar">
            <span class="shop-result-count" id="result-count">Loading...</span>
            <div class="shop-sort">
              <label>Sort:</label>
              <select id="sort-select" onchange="applyFilters()">
                <option value="newest">Newest</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="name">Name A-Z</option>
              </select>
            </div>
          </div>
          <div class="product-grid" id="product-grid">
            <div class="loading-overlay"><div class="spinner"></div><p>Loading collection...</p></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer"><div class="container">
    <div class="footer-bottom">
      <span>© 2024 A Charkha Story. Handcrafted with ❤️ in India.</span>
      <span>Celebrating Swadeshi & Sustainable Fashion</span>
    </div>
  </div></footer>

  <script src="/js/api.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
