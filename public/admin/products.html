<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — A Charkha Story Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo-icon"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="#C2703E" stroke-width="2"/><circle cx="20" cy="20" r="8" stroke="#C2703E" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#C2703E"/><line x1="20" y1="4" x2="20" y2="12" stroke="#C2703E" stroke-width="1.5"/><line x1="20" y1="28" x2="20" y2="36" stroke="#C2703E" stroke-width="1.5"/><line x1="4" y1="20" x2="12" y2="20" stroke="#C2703E" stroke-width="1.5"/><line x1="28" y1="20" x2="36" y2="20" stroke="#C2703E" stroke-width="1.5"/></svg></div><div><div class="sidebar-brand">A Charkha <span>Story</span></div><div class="sidebar-badge">Admin Panel</div></div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Main</div>
        <a href="/admin" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
        <div class="sidebar-section-label">Management</div>
        <a href="/admin/users" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a>
        <a href="/admin/orders" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Orders</a>
        <a href="/admin/products" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Products</a>
        <div class="sidebar-section-label">Insights</div>
        <a href="/admin/analytics" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics</a>
        <a href="/admin/coupons" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>Coupons</a>
      </nav>
      <div class="sidebar-footer"><a href="#" onclick="adminLogout(); return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out</a></div>
    </aside>
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-toggle" id="sidebar-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-title"><h1>Product Management</h1><p>Add, edit, and manage your product catalog</p></div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-sm btn-secondary" onclick="exportProducts()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
          </button>
          <button class="btn btn-sm btn-primary" onclick="openProductModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Product
          </button>
          <div class="topbar-profile" onclick="adminLogout()"><div class="topbar-avatar" id="admin-avatar">A</div><div><div class="topbar-profile-name" id="admin-name">Admin</div><div class="topbar-profile-role">Administrator</div></div></div>
        </div>
      </header>

      <div class="page-content">
        <!-- Low stock alert -->
        <div id="low-stock-alert" class="hidden" style="background:rgba(184,64,64,0.06);border:1px solid rgba(184,64,64,0.15);border-radius:var(--radius-md);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#B84040" stroke-width="2" style="width:20px;height:20px;flex-shrink:0;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="low-stock-text" style="font-size:0.8375rem;color:var(--color-error);font-weight:500;"></span>
        </div>

        <div class="filter-bar">
          <input type="search" class="form-control" id="product-search" placeholder="Search products...">
          <select class="form-control" id="product-category-filter">
            <option value="">All Categories</option>
            <option>Sarees</option><option>Kurtis</option><option>Shirts</option><option>Dupattas</option><option>Fabrics</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Fabric</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Featured</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table">
                <tr><td colspan="8"><div class="loading-spinner"><div class="spinner"></div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Add/Edit Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="product-modal-title">Add Product</h3>
        <button class="modal-close" onclick="closeModal('product-modal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="form-row">
            <div class="form-group">
              <label for="p-name">Product Name *</label>
              <input type="text" id="p-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="p-price">Price (₹) *</label>
              <input type="number" id="p-price" class="form-control" min="0" step="1" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="p-category">Category *</label>
              <select id="p-category" class="form-control" required>
                <option value="">Select</option>
                <option>Sarees</option><option>Kurtis</option><option>Shirts</option><option>Dupattas</option><option>Fabrics</option>
              </select>
            </div>
            <div class="form-group">
              <label for="p-fabric">Fabric Type *</label>
              <select id="p-fabric" class="form-control" required>
                <option value="">Select</option>
                <option>Khadi</option><option>Silk</option><option>Cotton</option><option>Chanderi</option><option>Linen</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="p-stock">Stock Quantity</label>
              <input type="number" id="p-stock" class="form-control" min="0" value="0">
            </div>
            <div class="form-group">
              <label for="p-image">Image URL</label>
              <input type="text" id="p-image" class="form-control" placeholder="/images/products/...">
            </div>
          </div>
          <div class="form-group">
            <label for="p-description">Description</label>
            <textarea id="p-description" class="form-control" rows="3"></textarea>
          </div>
          <div class="form-row">
            <div class="form-check">
              <input type="checkbox" id="p-featured">
              <label for="p-featured">Featured Product</label>
            </div>
            <div class="form-check">
              <input type="checkbox" id="p-gift">
              <label for="p-gift">Gift Worthy</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('product-modal')">Cancel</button>
        <button class="btn btn-primary" id="product-save-btn" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/products.js"></script>
</body>
</html>
